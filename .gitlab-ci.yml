# ============================================================
# 光压云盘开发者API控制台 - GitLab CI/CD 工作流
# 基于 GitFlow 分支策略
# ============================================================
# 分支说明:
#   main       - 生产分支（打 tag 后自动发布 Release）
#   develop    - 开发集成分支
#   feature/*  - 功能开发分支
#   release/*  - 发布预备分支
#   hotfix/*   - 热修复分支
# ============================================================

stages:
  - lint      # 代码检查
  - build     # 打包构建
  - release   # 版本发布

# 全局变量
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PACKAGE_NAME: "guangyapan-api-console"

# 缓存 pip 依赖
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .pip-cache/
    - .venv/

# ============================================================
# 阶段一：代码检查（所有分支）
# ============================================================
lint:
  stage: lint
  image: python:3.11-slim
  rules:
    - if: '$CI_COMMIT_BRANCH'  # 所有分支 push 时触发
  script:
    - pip install flake8
    - flake8 app.py --max-line-length=120 --ignore=E501,W503,E402
  allow_failure: true  # lint 失败不阻断流程

# ============================================================
# 阶段二：打包构建（main / develop / release 分支）
# ============================================================
build:
  stage: build
  image: python:3.11-slim
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.*/'
  script:
    - echo "开始打包源码..."
    # 生成版本号（分支名或 tag 名）
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="$CI_COMMIT_TAG"
      else
        VERSION="$CI_COMMIT_REF_SLUG-$(echo $CI_COMMIT_SHORT_SHA)"
      fi
      echo "版本: $VERSION"
      echo "VERSION=$VERSION" >> version.env
    # 打包源码（排除敏感文件和非必要文件）
    - |
      tar -czf "${PACKAGE_NAME}-${VERSION}.tar.gz" \
        --exclude=".git" \
        --exclude="config.json" \
        --exclude="__pycache__" \
        --exclude="*.pyc" \
        --exclude=".DS_Store" \
        --exclude="*.log" \
        --exclude="venv" \
        --exclude=".venv" \
        --exclude=".gitlab-ci.yml" \
        .
    - ls -lh "${PACKAGE_NAME}-${VERSION}.tar.gz"
  artifacts:
    paths:
      - "${PACKAGE_NAME}-*.tar.gz"
      - version.env
    expire_in: 30 days

# ============================================================
# 阶段三：版本发布（打 tag v* 时自动触发）
# ============================================================
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'  # 匹配 v1.0.0 格式
  needs:
    - job: build
      artifacts: true
  script:
    - echo "发布版本 $CI_COMMIT_TAG"
    - source version.env
    - echo "源码包: ${PACKAGE_NAME}-${VERSION}.tar.gz"
    # 计算 SHA256 校验和
    - sha256sum "${PACKAGE_NAME}-${VERSION}.tar.gz" > "${PACKAGE_NAME}-${VERSION}.tar.gz.sha256"
    - cat "${PACKAGE_NAME}-${VERSION}.tar.gz.sha256"
  release:
    name: "Release $CI_COMMIT_TAG"
    description: |
      ## 光压云盘开发者API控制台 $CI_COMMIT_TAG

      ### 功能特性
      - Flask 后端封装全部 10 个接口，自动签名鉴权（MD5 二进制 + SHA512）
      - 前端 Web 控制台，支持文件管理 / 预上传审核 / 正式上传
      - 凭证配置抽离到 config.json，通过 .gitignore 排除

      ### 使用方式
      1. 下载源码包并解压
      2. 复制 config.example.json 为 config.json，填入你的 client_id 和 client_secret
      3. 安装依赖: pip install flask requests
      4. 启动服务: python app.py
      5. 浏览器访问 http://localhost:5001

      ### 校验和
      ```
      $(cat ${PACKAGE_NAME}-${VERSION}.tar.gz.sha256)
      ```
    tag_name: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "Source Code (tar.gz)"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/${PACKAGE_NAME}-${VERSION}.tar.gz"
        - name: "SHA256 Checksum"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/${PACKAGE_NAME}-${VERSION}.tar.gz.sha256"
